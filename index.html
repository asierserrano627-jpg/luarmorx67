
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LuarmorX — Auto Protect</title>
<style>
:root {
  --bg:#080c18;
  --panel:#0d1224;
  --panel2:#111827;
  --border:#1a2540;
  --green:#00ff88;
  --cyan:#00cfff;
  --text:#dde6ff;
  --muted:#71809e;
}
* {box-sizing:border-box}
body {
  margin:0;
  padding:25px 14px 50px;
  background:var(--bg);
  color:var(--text);
  font-family:Arial,sans-serif;
}
.container {
  max-width:700px;
  margin:auto;
}
.logo {
  display:flex;
  align-items:center;
  justify-content:center;
  gap:12px;
  margin:15px 0 30px;
}
.logo-icon {
  width:42px;height:42px;
  display:grid;place-items:center;
  border-radius:12px;
  color:#080c18;
  font-size:24px;
  background:linear-gradient(135deg,var(--green),var(--cyan));
}
.logo-text {
  font-size:23px;
  font-weight:900;
  letter-spacing:3px;
  color:white;
}
.logo-text span {color:var(--green)}
.subtitle {
  text-align:center;
  color:var(--muted);
  font-size:12px;
  margin-top:-18px;
  margin-bottom:28px;
}
.card {
  background:var(--panel);
  border:1px solid var(--border);
  border-radius:13px;
  padding:18px;
  margin-bottom:13px;
}
.card-title {
  font-size:11px;
  font-weight:bold;
  letter-spacing:1.5px;
  color:var(--muted);
  margin-bottom:15px;
}
label {
  display:block;
  color:var(--muted);
  font-size:11px;
  margin-bottom:7px;
}
input,textarea {
  width:100%;
  background:var(--panel2);
  border:1px solid var(--border);
  border-radius:8px;
  padding:13px;
  color:white;
  outline:none;
  font-family:monospace;
  font-size:13px;
}
input:focus,textarea:focus {
  border-color:var(--cyan);
}
textarea {
  min-height:190px;
  resize:vertical;
  line-height:1.6;
}
button {
  width:100%;
  border:0;
  padding:14px;
  border-radius:9px;
  cursor:pointer;
  font-weight:bold;
  font-size:13px;
  letter-spacing:1px;
  margin-top:10px;
}
.primary {
  background:linear-gradient(135deg,var(--green),var(--cyan));
  color:#080c18;
}
.secondary {
  background:var(--panel2);
  border:1px solid var(--border);
  color:white;
}
.status {
  display:none;
  padding:13px;
  background:#10251e;
  border:1px solid #17633d;
  color:var(--green);
  border-radius:8px;
  font-size:12px;
  margin-top:12px;
}
.preview {
  background:#050810;
  border:1px solid var(--border);
  padding:15px;
  border-radius:9px;
  color:var(--cyan);
  font-family:monospace;
  font-size:12px;
  overflow-wrap:anywhere;
}
.footer {
  text-align:center;
  color:var(--muted);
  font-size:10px;
  margin-top:30px;
}
</style>
</head>
<body>

<div class="container">

  <div class="logo">
    <div class="logo-icon">⬡</div>
    <div class="logo-text">LUARMOR<span>X</span></div>
  </div>

  <div class="subtitle">
    SCRIPT MANAGEMENT & PROTECTION PLATFORM
  </div>

  <div class="card">
    <div class="card-title">CONFIGURACIÓN</div>

    <label>Nombre del proyecto</label>
    <input id="name" placeholder="Mi proyecto">
  </div>

  <div class="card">
    <div class="card-title">SCRIPT LUA</div>

    <label>Contenido del script</label>
    <textarea id="source"
      placeholder="-- Escribe o pega tu código Lua aquí"></textarea>

    <button class="primary" onclick="preview()">
      GENERAR VISTA PREVIA
    </button>

    <div class="status" id="status"></div>
  </div>

  <div class="card" id="result" style="display:none">
    <div class="card-title">VISTA PREVIA</div>

    <div class="preview" id="preview"></div>

    <button class="secondary" onclick="copyCode()">
      COPIAR CÓDIGO
    </button>
  </div>

  <div class="card">
    <div class="card-title">INFORMACIÓN</div>
    <p style="font-size:12px;color:var(--muted);line-height:1.8">
      LuarmorX permite preparar y gestionar proyectos Lua.
      La publicación y distribución de proyectos se habilitará
      cuando conectemos el almacenamiento y la API.
    </p>
  </div>

  <div class="footer">
    LUARMORX © 2026 — ALL RIGHTS RESERVED
  </div>

</div>

<script>
function preview() {
  const name = document.getElementById("name").value.trim();
  const code = document.getElementById("source").value;

  const status = document.getElementById("status");
  const result = document.getElementById("result");

  if (!code.trim()) {
    status.style.display = "block";
    status.style.color = "#ff4757";
    status.textContent = "Introduce un script primero.";
    return;
  }

  document.getElementById("preview").textContent =
    "-- " + (name || "Mi proyecto") + "\n\n" + code;

  result.style.display = "block";
  status.style.display = "block";
  status.style.color = "#00ff88";
  status.textContent = "Vista previa generada correctamente.";

  result.scrollIntoView({behavior:"smooth"});
}

function copyCode() {
  const code = document.getElementById("preview").textContent;

  navigator.clipboard.writeText(code).then(() => {
    alert("Código copiado correctamente.");
  }).catch(() => {
    alert("No se pudo copiar el código.");
  });
}
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<title>LuarmorX — Auto Protect</title>
<style>
:root{--bg:#080c18;--bg2:#0d1224;--bg3:#111827;--border:#1a2540;--green:#00ff88;--cyan:#00cfff;--red:#ff4757;--text:#dde6ff;--muted:#5a6a8a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:inherit;margin:0;padding:0}
html,body{background:var(--bg);color:var(--text);font-family:'Courier New',monospace;font-size:13px}
body{display:flex;flex-direction:column;align-items:center;padding:16px 12px 40px}
.logo{display:flex;align-items:center;gap:10px;margin:10px 0 20px}
.logo-icon{width:34px;height:34px;background:linear-gradient(135deg,var(--green),var(--cyan));border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:18px}
.logo-text{font-size:18px;font-weight:bold;letter-spacing:3px;color:#fff}
.logo-text span{color:var(--green)}
.wrap{width:100%;max-width:660px;display:flex;flex-direction:column;gap:10px}
.card{background:var(--bg2);border:1px solid var(--border);border-radius:10px;padding:14px}
.card-title{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:1.5px;margin-bottom:10px}
.field{display:flex;flex-direction:column;gap:5px;margin-bottom:10px}
.field:last-child{margin-bottom:0}
.lbl{font-size:10px;color:var(--muted)}
input,textarea{background:var(--bg3);border:1px solid var(--border);border-radius:7px;padding:9px 12px;color:var(--text);font-family:'Courier New',monospace;font-size:12px;outline:none;width:100%;transition:border .15s}
input:focus,textarea:focus{border-color:var(--cyan)}
textarea{resize:vertical;min-height:130px;line-height:1.6}
.btn{width:100%;padding:12px;border:none;border-radius:8px;font-family:'Courier New',monospace;font-size:13px;font-weight:bold;cursor:pointer;transition:.15s;letter-spacing:1px}
.btn:active{transform:scale(.98)}
.btn-main{background:linear-gradient(135deg,var(--green),var(--cyan));color:#080c18}
.btn-main:disabled{opacity:.4;cursor:not-allowed;transform:none}
.btn-sec{background:var(--bg3);border:1px solid var(--border);color:var(--text);margin-top:6px}
.progress{height:3px;background:var(--bg3);border-radius:2px;overflow:hidden;display:none;margin-bottom:4px}
.progress-bar{height:100%;background:linear-gradient(90deg,var(--green),var(--cyan));border-radius:2px;transition:width .4s;width:0%}
.step-msg{font-size:11px;text-align:center;min-height:16px;margin-bottom:6px}
.badge{display:inline-block;font-size:10px;padding:2px 8px;border-radius:20px}
.b-ok{background:#0a2e1a;color:var(--green);border:1px solid #0a5e30}
.code-box{background:#050810;border:1px solid var(--green);border-radius:7px;padding:12px;font-size:11px;color:var(--green);word-break:break-all;white-space:pre-wrap;line-height:1.7;max-height:160px;overflow-y:auto}
.row-hd{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.cp-btn{background:var(--bg3);border:1px solid var(--border);color:var(--text);border-radius:5px;padding:3px 10px;font-size:10px;cursor:pointer;font-family:monospace}
.cp-btn:hover{border-color:var(--green);color:var(--green)}
.url-display{background:#050810;border:1px solid var(--cyan);border-radius:7px;padding:10px 12px;font-size:11px;color:var(--cyan);word-break:break-all;margin-bottom:8px;line-height:1.6}
.url-display.green{border-color:var(--green);color:var(--green)}
.lm-preview{background:#0d1225;border:1px solid var(--border);border-radius:10px;padding:18px;text-align:center}
.lm-icon{font-size:26px;margin-bottom:6px}
.lm-title{color:#fff;font-size:15px;font-weight:bold;font-family:sans-serif;margin-bottom:12px}
.lm-code{background:#080c18;border-radius:7px;padding:12px;font-size:12px;line-height:1.9;text-align:left}
.lm-key{color:#f7c948}.lm-fn{color:var(--cyan)}.lm-cm{color:var(--muted);font-style:italic}
.lm-bar{height:2px;background:var(--bg3);border-radius:2px;margin-top:10px;overflow:hidden}
.lm-bar-inner{height:100%;width:30%;background:linear-gradient(90deg,transparent,var(--cyan),transparent);animation:sh 2s infinite}
@keyframes sh{0%{transform:translateX(-200%)}100%{transform:translateX(500%)}}
.lm-note{font-size:9px;color:var(--muted);margin-top:8px;font-family:sans-serif}
</style>
</head>
<body>
<div class="logo"><div class="logo-icon">⬡</div><div class="logo-text">LUARMOR<span>X</span></div></div>
<div class="wrap">

<div class="card">
  <div class="card-title">Configuración</div>
  <div class="field">
    <div class="lbl">Nombre del archivo</div>
    <input id="fnname" placeholder="mi-script"/>
  </div>
</div>

<div class="card">
  <div class="card-title">Script Lua</div>
  <textarea id="src" placeholder="-- Pega tu script aquí"></textarea>
</div>

<div class="progress" id="pw"><div class="progress-bar" id="pb"></div></div>
<div class="step-msg" id="stepmsg"></div>
<button class="btn btn-main" id="mainbtn" onclick="doAll()">⬡ CIFRAR Y SUBIR</button>

<div id="outblock" style="display:none;flex-direction:column;gap:10px">

  <div class="card">
    <div class="card-title">Tu Link <span class="badge b-ok">LIVE</span></div>
    <div class="lbl" style="margin-bottom:6px">URL (para Roblox)</div>
    <div class="url-display green" id="urlbox">—</div>
    <div style="display:flex;gap:6px">
      <button class="cp-btn" style="flex:1;padding:7px" onclick="cp(G.rawUrl,this)">Copiar URL</button>
      <button class="cp-btn" style="flex:1;padding:7px" onclick="window.open(G.rawUrl,'_blank')">Ver página</button>
    </div>
  </div>

  <div class="lm-preview" id="previewblock">
    <div class="lm-icon">📜</div>
    <div class="lm-title">Loadstring listo</div>
    <div class="lm-code">
      <span class="lm-key">script_key</span> = <span style="color:#e06c75">"KEY"</span>; <span class="lm-cm">-- A key system is active</span><br>
      <span class="lm-fn">loadstring</span>(<span id="preview-url" class="lm-fn"></span>)()
      <div class="lm-bar"><div class="lm-bar-inner"></div></div>
    </div>
    <div class="lm-note">Contents can not be displayed on browser • https://luarmor.net/</div>
  </div>

  <div class="card" id="loadercard">
    <div class="row-hd"><span>Loader <span class="badge b-ok">Distribuye esto</span></span><button class="cp-btn" onclick="cp(G.loader,this)">Copiar</button></div>
    <div class="code-box" id="loaderbox"></div>
  </div>

  <button class="btn btn-sec" onclick="doAll()">⟳ Volver a cifrar y subir</button>

</div>
</div>

<script>
var G = {loader:'', rawUrl:'', secret:''};
var ABC = 'abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789';

function rnd(n){
  var s = '';
  for(var i=0;i<n;i++) s += ABC[Math.floor(Math.random()*ABC.length)];
  return s;
}

function fnv(s){
  var h = 0x811c9dc5;
  for(var i=0;i<s.length;i++){
    h ^= s.charCodeAt(i);
    h = Math.imul(h, 0x01000193) >>> 0;
  }
  return h.toString(16).padStart(8,'0');
}

function xorStr(str, k){
  var o = '';
  for(var i=0;i<str.length;i++) o += String.fromCharCode(str.charCodeAt(i) ^ k[i % k.length]);
  return o;
}

function toBytes(str){
  var o = '';
  for(var i=0;i<str.length;i++){
    o += '\\' + str.charCodeAt(i);
  }
  return o;
}

function setMsg(t, c){
  var e = document.getElementById('stepmsg');
  e.style.color = c || 'var(--cyan)';
  e.textContent = t;
}

function setPb(p){
  document.getElementById('pb').style.width = p + '%';
}

function sleep(ms){
  return new Promise(function(r){ setTimeout(r, ms); });
}

function cp(txt, el){
  if(!txt) return;
  navigator.clipboard.writeText(txt).catch(function(){
    var t = document.createElement('textarea');
    t.value = txt;
    document.body.appendChild(t);
    t.select();
    document.execCommand('copy');
    document.body.removeChild(t);
  });
  var o = el.textContent;
  el.textContent = '¡Copiado!';
  setTimeout(function(){ el.textContent = o; }, 1500);
}

function buildCiphered(src, secret){
  var key1 = [];
  for(var i=0;i<32;i++) key1.push(Math.floor(Math.random()*256));
  var key2 = [];
  for(var i=0;i<16;i++) key2.push(Math.floor(Math.random()*256));

  var srcHash = fnv(src + secret);
  var secretHash = fnv(secret);

  var stage1 = xorStr(src, key1);
  var stage2 = xorStr(stage1, key2);
  var payload = toBytes(stage2);

  var chunks = [];
  for(var i=0;i<payload.length;i+=70){
    chunks.push('"' + payload.slice(i, i+70) + '"');
  }

  var v = {
    fh: '_' + rnd(9), xd: '_' + rnd(9),
    k1: '_' + rnd(8), k2: '_' + rnd(8),
    sh: '_' + rnd(8), se: '_' + rnd(8),
    ch: '_' + rnd(8), rw: '_' + rnd(8),
    dc: '_' + rnd(8), fn: '_' + rnd(8),
    er: '_' + rnd(8), i: '_i' + rnd(5),
    s: '_s' + rnd(5), k: '_k' + rnd(5),
    r: '_r' + rnd(5), a: '_a' + rnd(4),
    t: '_t' + rnd(4)
  };

  var code = [
    '-- LuarmorX Protected',
    'local function ' + v.fh + '(' + v.s + ')',
    ' local ' + v.r + ',n=0x811c9dc5,#' + v.s,
    ' for ' + v.i + '=1,n do ' + v.r + '=bit32.band(bit32.bxor(' + v.r + ',' + v.s + ':byte(' + v.i + '))*0x01000193,0xFFFFFFFF) end',
    ' return string.format("%08x",' + v.r + ')',
    'end',
    'local function ' + v.xd + '(' + v.s + ',' + v.k + ')',
    ' local ' + v.r + ',n={},#' + v.k,
    ' for ' + v.i + '=1,#' + v.s + ' do ' + v.r + '[' + v.i + ']=string.char(bit32.bxor(' + v.s + ':byte(' + v.i + '),' + v.k + '[((' + v.i + '-1)%n)+1])) end',
    ' return table.concat(' + v.r + ')',
    'end',
    'local ' + v.k1 + '={' + key1.join(',') + '}',
    'local ' + v.k2 + '={' + key2.join(',') + '}',
    'local ' + v.sh + '="' + srcHash + '"',
    'local ' + v.se + '="' + secretHash + '"',
    'local ' + v.a + '=...',
    'if type(' + v.a + ')~="string" or ' + v.fh + '(' + v.a + ')~=' + v.se + ' then',
    ' pcall(function() game:GetService("Players").LocalPlayer:Kick("[LuarmorX] Anti-tamper detected.") end)',
    ' return',
    'end',
    'local ' + v.t + '=getfenv and getfenv() or _ENV',
    'if ' + v.t + ' and (' + v.t + '.print or ' + v.t + '.warn) then',
    ' local _op,_ow=' + v.t + '.print,' + v.t + '.warn',
    ' if _op then ' + v.t + '.print=function(...) if select("#",...)>0 then local s=tostring(select(1,...)) if #s>400 and s:find("function",1,true) then pcall(function() game.Players.LocalPlayer:Kick("[LuarmorX] Dump attempt") end) return end end return _op(...) end end',
    ' if _ow then ' + v.t + '.warn=function(...) if select("#",...)>0 then local s=tostring(select(1,...)) if #s>400 and s:find("function",1,true) then pcall(function() game.Players.LocalPlayer:Kick("[LuarmorX] Dump attempt") end) return end end return _ow(...) end end',
    'end',
    'local ' + v.ch + '={' + chunks.join(',') + '}',
    'local ' + v.rw + '=table.concat(' + v.ch + ')',
    'local ' + v.dc + '=' + v.xd + '(' + v.xd + '(' + v.rw + ',' + v.k2 + '),' + v.k1 + ')',
    'if ' + v.fh + '(' + v.dc + '..' + v.a + ')~=' + v.sh + ' then warn("[LuarmorX] Integrity check failed") return end',
    'local ' + v.fn + ',' + v.er + '=loadstring(' + v.dc + ')',
    'if not ' + v.fn + ' then warn("[LuarmorX] "..tostring(' + v.er + ')) return end',
    v.fn + '()'
  ].join('\n');

  return code;
}

async function uploadWorker(id, lua, loader){
  var base = window.location.origin;
  var resp = await fetch(base + '/api/upload', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({id: id, lua: lua, loader: loader})
  });

  if(!resp.ok){
    var ej = await resp.json().catch(function(){ return {}; });
    throw new Error(ej.error || 'HTTP ' + resp.status);
  }
  return await resp.json();
}

async function doAll(){
  var src = document.getElementById('src').value.trim();
  if(!src){ alert('Pega tu script Lua'); return; }

  var btn = document.getElementById('mainbtn');
  btn.disabled = true;
  document.getElementById('pw').style.display = 'block';
  document.getElementById('outblock').style.display = 'none';

  try{
    setMsg('Cifrando script...'); setPb(20); await sleep(60);
    G.secret = 'LMX_' + rnd(22);
    var ciphered = buildCiphered(src, G.secret);

    setMsg('Subiendo...'); setPb(70);
    var scriptId = rnd(12);
    G.rawUrl = window.location.origin + '/api/' + scriptId;
    G.loader = '-- LuarmorX Protected\n' +
      'script_key = "KEY"; -- A key system is active\n' +
      'loadstring(game:HttpGet("' + G.rawUrl + '"))("' + G.secret + '")';

    await uploadWorker(scriptId, ciphered, G.loader);

    setPb(100); await sleep(50);

    document.getElementById('urlbox').textContent = G.rawUrl;
    document.getElementById('preview-url').textContent = 'game:HttpGet("' + G.rawUrl + '")';
    document.getElementById('loaderbox').textContent = G.loader;

    var ob = document.getElementById('outblock');
    ob.style.display = 'flex';
    ob.style.flexDirection = 'column';
    ob.style.gap = '10px';
    setMsg('✓ Listo', 'var(--green)');
    ob.scrollIntoView({behavior:'smooth', block:'start'});

  } catch(e){
    setMsg('Error: ' + e.message, 'var(--red)');
  } finally {
    document.getElementById('pw').style.display = 'none';
    btn.disabled = false;
  }
}
</script>
</body>
</html>
